# 정적 데모(답변등기)를 GitHub Pages 로 배포한다.
#
# 배포되는 것은 브라우저에서 도는 데모다. 검증 로직(해시·봉인·차단)은 mock 이 아니라
# WebCrypto 로 실제 실행되지만, "UI 를 거치지 않은 curl 도 차단된다"는 증명은
# 서버 모드의 테스트와 tamper-demo 가 담당한다.
name: Deploy static demo to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/answer-registry-mvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 서버 모드의 불변조건 테스트가 깨지면 배포하지 않는다.
      - run: npx vitest run

      - run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /kb_AI_challenge

      # _next 로 시작하는 경로가 Jekyll 처리로 사라지지 않도록.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
